name: FE Build

on:
  push:
    branches: [main, test]
  workflow_dispatch:

jobs:
  build:
    name: Build and publish FE artifact
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ github.ref == 'refs/heads/test' && 'fe-dist-test' || 'fe-dist' }}
          path: dist/
          retention-days: 7
      - name: Trigger BE deploy
        uses: actions/github-script@v7
        env:
          TOKEN: ${{ secrets.FE_ARTIFACT_TOKEN }}
        with:
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'vanhoutenbos',
              repo: 'SquadTime',
              event_type: 'fe-built',
              client_payload: {
                artifact: '${{ github.ref == 'refs/heads/test' && 'fe-dist-test' || 'fe-dist' }}',
                branch: '${{ github.ref_name }}',
                run_id: '${{ github.run_id }}'
              }
            });
